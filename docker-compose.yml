# Self-hosted Plausible CE built from this fork (adds opt-in persistent
# visitor tracking, see deploy/README.md).
#
#   cp plausible-conf.env.example plausible-conf.env   # then edit it
#   docker compose up -d --build
#
# Service and volume names match plausible/community-edition, so existing
# CE data volumes can be reused.
services:
  mail:
    image: bytemark/smtp
    restart: always

  plausible_db:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      start_period: 1m

  plausible_events_db:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-24.12}-alpine
    restart: always
    volumes:
      - event-data:/var/lib/clickhouse
      - event-logs:/var/log/clickhouse-server
      - ./deploy/clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - ./deploy/clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      - ./deploy/clickhouse/default-profile-logs.xml:/etc/clickhouse-server/users.d/logs.xml:ro
      # Uncomment on small servers (< 4GB RAM):
      # - ./deploy/clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      start_period: 1m

  plausible:
    build:
      context: .
      args:
        MIX_ENV: ce
    image: plausible-deviceid:local
    restart: always
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
      mail:
        condition: service_started
    ports:
      - 127.0.0.1:8000:8000
    env_file:
      - plausible-conf.env
    volumes:
      - plausible-data:/var/lib/plausible

volumes:
  db-data:
    driver: local
  event-data:
    driver: local
  event-logs:
    driver: local
  plausible-data:
    driver: local
